$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "acal-xpath-yaml-v1.0-structure.schema.yaml"
title: "YACAL v1.0 XPath Profile structural schema"
description: >
  XPath Profile structural schema for the YAML representation of ACAL Version
  1.0. This artifact defines the XPath-specific extension shapes that may be
  composed with the YACAL core structural schema.
$comment: >
  This schema does not replace the YACAL core structural schema. It defines the
  profile-specific object shapes that composition schemas may attach to the core
  extension hooks for PolicyDefaultsType, AttributeSelectorType,
  EntityAttributeSelectorType, and StructuredValueType. There is no
  RequestDefaultsType extension hook attachment here: XPathRequestDefaultsType
  was removed (issue #134) once request-side xpathExpression values became
  fully self-contained.
$defs:
  NamespaceMapType:
    type: object
    propertyNames:
      anyOf:
        - const: ""
        - type: string
          pattern: "^[A-Za-z_][A-Za-z0-9_.-]*$"
          not:
            const: "xmlns"
      $comment: >
        A namespace Prefix is an XML NCName [NAMESPACES], not an ACAL
        IdentifierType - it has no {ShortId} macro-substitution concept, and
        its lexical space is narrower. This pattern is an ASCII-practical
        approximation of NCName, in the same spirit as IdentifierType's own
        documented looseness (see that $def's $comment) but for a different,
        narrower grammar; 'xmlns' is excluded because [NAMESPACES] reserves it
        and never permits it as a prefix. The empty string key is the
        separate, valid default-namespace declaration.
    additionalProperties:
      type: string
      format: uri-reference
    $comment: >
      Maps each namespace Prefix (the empty string denotes the default
      namespace) directly to its Name (URI), rather than an array of
      {Prefix, Name} pair-objects, per issue #134. A producer SHALL NOT emit a
      duplicate key; a consumer SHALL reject one. This cannot be expressed as a
      schema constraint, since a validator only sees the instance after
      parsing, by which point a duplicate key has already been resolved in an
      implementation-defined way - see acal-xpath-v1.0.md Section 5.2 for the
      normative producer/consumer requirement.

  XPathDefaultsType:
    type: object
    required:
      - XPathVersion
    properties:
      XPathVersion:
        $ref: "acal-core-yaml-v1.0-structure.schema.yaml#/$defs/IdentifierType"
    additionalProperties: false

  XPathPolicyDefaultsTypeTree:
    type: object
    required:
      - XPathPolicyDefaults
    properties:
      XPathPolicyDefaults:
        $ref: "#/$defs/XPathDefaultsType"
    additionalProperties: false

  XPathAttributeSelectorType:
    allOf:
      - $ref: "acal-core-yaml-v1.0-structure.schema.yaml#/$defs/AttributeSelectorType"
      - type: object
        required:
          - Namespace
        properties:
          ContextSelectorId:
            $ref: "acal-core-yaml-v1.0-structure.schema.yaml#/$defs/IdentifierType"
          Namespace:
            $ref: "#/$defs/NamespaceMapType"
    unevaluatedProperties: false

  XPathEntityAttributeSelectorType:
    allOf:
      - $ref: "acal-core-yaml-v1.0-structure.schema.yaml#/$defs/EntityAttributeSelectorType"
      - type: object
        required:
          - Namespace
        properties:
          ContextSelectorId:
            $ref: "acal-core-yaml-v1.0-structure.schema.yaml#/$defs/IdentifierType"
          Namespace:
            $ref: "#/$defs/NamespaceMapType"
    unevaluatedProperties: false

  XPathExpressionValueType:
    type: object
    required:
      - XPathVersion
      - Namespace
      - XPathCategory
      - XPath
    properties:
      XPathVersion:
        $ref: "acal-core-yaml-v1.0-structure.schema.yaml#/$defs/IdentifierType"
      Namespace:
        $ref: "#/$defs/NamespaceMapType"
      XPathCategory:
        $ref: "acal-core-yaml-v1.0-structure.schema.yaml#/$defs/IdentifierType"
      XPath:
        $ref: "acal-core-yaml-v1.0-structure.schema.yaml#/$defs/AttributeSelectorPathType"
    unevaluatedProperties: false

  XPathStructuredValueTypeExtension:
    type: object
    required:
      - XPathVersion
      - Namespace
      - XPathCategory
      - XPath
    properties:
      DataType:
        $ref: "acal-core-yaml-v1.0-structure.schema.yaml#/$defs/IdentifierType"
      XPathVersion:
        $ref: "acal-core-yaml-v1.0-structure.schema.yaml#/$defs/IdentifierType"
      Namespace:
        $ref: "#/$defs/NamespaceMapType"
      XPathCategory:
        $ref: "acal-core-yaml-v1.0-structure.schema.yaml#/$defs/IdentifierType"
      XPath:
        $ref: "acal-core-yaml-v1.0-structure.schema.yaml#/$defs/AttributeSelectorPathType"
    additionalProperties: false
    $comment: >
      Composition-facing helper for the core StructuredValueType extension
      hook. The optional DataType property is permitted here so the same
      helper works in both explicit-DataType and parent-inferred contexts.
      XPathVersion and Namespace are required, matching XPathExpressionValueType
      above (issue #134): a self-contained value carries both regardless of
      which extension hook composes it in.

  XPathPolicyDefaultsTypeExtension:
    $ref: "#/$defs/XPathPolicyDefaultsTypeTree"

  XPathAttributeSelectorTypeExtension:
    $ref: "#/$defs/XPathAttributeSelectorType"

  XPathEntityAttributeSelectorTypeExtension:
    $ref: "#/$defs/XPathEntityAttributeSelectorType"
